<!DOCTYPE html>    <!--tipo de documento, en este caso HTML5, que e spuramente estructura--> 
<html lang="en">   <!--el idioma del narrador, util para el SEO-->
<head>             <!--unico para la web, en el hay meta informacion, no se renderiza en la prevew-->
    <meta charset="UTF-8">       <!--le dice al navegador que el conjunto de caracteres es UTF-8, incluye casi todos los caracteres (ñ, acentos etc)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">     <!--es lo que hace la web responsive, adaptandose a distintos tamaños-->
    <title>Pepinos</title>        <!--titulode la web, se ve en la pestaña del navegador-->
</head>
<body>
    <h1>Pepinos Mar & Sal</h1>     <!--titulo de la web, hay que intentar optimizar para que enderice bien y que solo haya un h1 pero igualmente se renderiza-->
    <h2>Bienvenidos a la mejor web de pepinos del mundo, y gratis</h2>  
    <br>                       <!--separador en html pero lo sustituiremos cuando usemos CSS-->
    <p>Los mejores pepinos de España y Portugal</p>        <!--parrafo de linea-->
    <a href="//www.google.com">Haz click aqui</a>                 <!--sirve para enlazar, href sirve para poenr la web de destino del enlace, se incluye el valor de href= lo que sea justo despues de la a-->
    <img src="imagen pepino2.jpg" width="400" alt="Superpepino de maxima calidad" >          <!--sirve para poner imagenes, si solo defines el ancho automaticamente ajusta le largo-->
                                                               <!--etiquetas autocompletables, es decir se renderiza-->
</body>
</html>
